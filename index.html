<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 하루 다이어리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .font-handwriting {
            font-family: 'Nanum Pen Script', cursive !important;
            font-size: 1.35rem !important;
        }
        input, textarea, select {
            font-size: 16px !important;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Theme Configurations */
        body.theme-dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.theme-dark header, body.theme-dark .theme-bg-card, body.theme-dark .modal-card {
            background-color: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }
        body.theme-dark input, body.theme-dark textarea, body.theme-dark select {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #334155;
        }

        body.theme-pastel {
            background-color: #fdfbf7;
            color: #4a403a;
        }
        body.theme-pastel header, body.theme-pastel .theme-bg-card, body.theme-pastel .modal-card {
            background-color: #fff9f2;
            color: #4a403a;
            border-color: #f3e8de;
        }

        body.theme-mono {
            background-color: #f4f4f5;
            color: #18181b;
        }
        body.theme-mono header, body.theme-mono .theme-bg-card, body.theme-mono .modal-card {
            background-color: #ffffff;
            color: #18181b;
            border-color: #e4e4e7;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-10 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex justify-between items-center max-w-lg mx-auto w-full">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-book-bookmark text-indigo-600"></i>
            <span id="app-title">하루 기록</span>
        </h1>
        <div class="flex items-center gap-1.5">
            <button onclick="switchTab('write')" id="tab-write-btn" class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i> 작성
            </button>
            <button onclick="switchTab('list')" id="tab-list-btn" class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                <i class="fa-solid fa-list-ul"></i> 목록 (<span id="diary-count">0</span>)
            </button>
            <button onclick="switchTab('calendar')" id="tab-cal-btn" class="px-2.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                <i class="fa-regular fa-calendar-days"></i> 달력
            </button>
            <button onclick="openSettings()" class="p-2 text-slate-500 hover:text-indigo-600 transition-colors ml-1" title="설정">
                <i class="fa-solid fa-gear text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-lg mx-auto w-full px-4 py-4 flex-1">

        <!-- TAB 1: Write / Edit Form -->
        <section id="view-write" class="space-y-4">
            <form id="diary-form" onsubmit="handleFormSubmit(event)" class="theme-bg-card bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <input type="hidden" id="entry-id">

                <!-- Date & Mood Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">📅 날짜 (필수)</label>
                        <input type="date" id="entry-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">🎭 오늘의 기분 (필수)</label>
                        <select id="entry-mood" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="😊 기분 좋음">😊 기분 좋음</option>
                            <option value="🔥 열정/의욕">🔥 열정/의욕</option>
                            <option value="🌿 평온/느긋">🌿 평온/느긋</option>
                            <option value="💡 영감/아이디어">💡 영감/아이디어</option>
                            <option value="☕ 휴식/힐링">☕ 휴식/힐링</option>
                            <option value="😴 피곤/지침">😴 피곤/지침</option>
                            <option value="😢 우울/슬픔">😢 우울/슬픔</option>
                            <option value="⚡ 스트레스/화남">⚡ 스트레스/화남</option>
                        </select>
                    </div>
                </div>

                <!-- Highlight Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">⭐ 오늘의 하이라이트 (한 줄 요약)</label>
                    <input type="text" id="entry-highlight" required placeholder="오늘 하루를 대표하는 한 줄" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Main Content Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">📝 상세 내용 (필수)</label>
                    <textarea id="entry-content" required rows="6" placeholder="오늘 어떤 일이 있었나요? 자유롭게 텍스트로 기록해보세요..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-check"></i> <span id="save-btn-text">일기 저장하기</span>
                    </button>
                    <button type="button" onclick="resetForm()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-sm transition-all">
                        초기화
                    </button>
                </div>
            </form>
        </section>

        <!-- TAB 2: Diary List -->
        <section id="view-list" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs text-slate-500 font-medium">총 <b id="list-count">0</b>개의 일기</span>
                <button onclick="exportAllDiaries()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 px-2.5 py-1.5 rounded-lg border border-indigo-100">
                    <i class="fa-solid fa-file-arrow-down"></i> 전체 내보내기 (.md)
                </button>
            </div>
            <div id="diary-container" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- TAB 3: Calendar View -->
        <section id="view-calendar" class="hidden space-y-4">
            <div class="theme-bg-card bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="cal-month-year" class="font-bold text-base">2026년 10월</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 mb-2">
                    <div class="text-rose-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-indigo-500">토</div>
                </div>
                <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Calendar days rendered here -->
                </div>
            </div>
            <div id="cal-selected-entry" class="hidden space-y-3">
                <!-- Entry details for clicked date -->
            </div>
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center px-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="modal-card bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-5 border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-gear text-indigo-600"></i> 앱 설정
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Theme Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">🎨 테마 컬러</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setTheme('default')" class="p-2 rounded-xl border text-xs font-semibold text-center border-indigo-500 bg-indigo-50 text-indigo-700">기본</button>
                    <button onclick="setTheme('dark')" class="p-2 rounded-xl border text-xs font-semibold text-center border-slate-700 bg-slate-900 text-white">다크</button>
                    <button onclick="setTheme('pastel')" class="p-2 rounded-xl border text-xs font-semibold text-center border-amber-200 bg-amber-50 text-amber-900">파스텔</button>
                    <button onclick="setTheme('mono')" class="p-2 rounded-xl border text-xs font-semibold text-center border-zinc-300 bg-zinc-100 text-zinc-900">모노톤</button>
                </div>
            </div>

            <!-- Layout Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">📐 목록 레이아웃</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setLayout('card')" id="layout-btn-card" class="p-2 rounded-xl border text-xs font-semibold text-center bg-indigo-50 border-indigo-500 text-indigo-700">카드형</button>
                    <button onclick="setLayout('list')" id="layout-btn-list" class="p-2 rounded-xl border text-xs font-semibold text-center bg-slate-50 border-slate-200 text-slate-600">콤팩트 리스트</button>
                </div>
            </div>

            <!-- Font Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">🖋️ 글꼴 스타일</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setFont('sans')" id="font-btn-sans" class="p-2 rounded-xl border text-xs font-semibold text-center bg-indigo-50 border-indigo-500 text-indigo-700">기본 산세리프</button>
                    <button onclick="setFont('handwriting')" id="font-btn-handwriting" class="p-2 rounded-xl border text-xs font-semibold text-center bg-slate-50 border-slate-200 text-slate-600 font-handwriting">나눔 손글씨</button>
                </div>
            </div>

            <button onclick="closeSettings()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold text-xs shadow-md">
                닫기
            </button>
        </div>
    </div>

    <!-- Global Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-full shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">저장되었습니다.</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Storage Keys
        const STORAGE_KEY = 'my_daily_diaries_v1';
        const SETTINGS_KEY = 'my_diary_settings_v1';

        // Initial State
        let diaries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        let userSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"theme":"default","layout":"card","font":"sans"}');
        
        let currentCalDate = new Date();

        // On Load Initializers
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('entry-date');
            if (dateInput) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }
            applySettings();
            updateDiaryCount();
            renderCalendar();
        });

        // Form Submission (Create or Update)
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const id = document.getElementById('entry-id').value;
            const date = document.getElementById('entry-date').value;
            const mood = document.getElementById('entry-mood').value;
            const highlight = document.getElementById('entry-highlight').value.trim();
            const content = document.getElementById('entry-content').value.trim();

            if (!date || !highlight || !content) {
                showToast('필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            if (id) {
                const index = diaries.findIndex(d => d.id === id);
                if (index !== -1) {
                    diaries[index] = { id, date, mood, highlight, content, updatedAt: new Date().toISOString() };
                    showToast('일기가 수정되었습니다!');
                }
            } else {
                const newEntry = {
                    id: 'diary_' + Date.now(),
                    date,
                    mood,
                    highlight,
                    content,
                    createdAt: new Date().toISOString()
                };
                diaries.unshift(newEntry);
                showToast('일기가 저장되었습니다!');
            }

            saveToStorage();
            updateDiaryCount();
            resetForm();
            switchTab('list');
        }

        function resetForm() {
            document.getElementById('entry-id').value = '';
            document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('entry-mood').value = '😊 기분 좋음';
            document.getElementById('entry-highlight').value = '';
            document.getElementById('entry-content').value = '';
            document.getElementById('save-btn-text').innerText = '일기 저장하기';
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(diaries));
        }

        function updateDiaryCount() {
            document.getElementById('diary-count').innerText = diaries.length;
            document.getElementById('list-count').innerText = diaries.length;
        }

        // Tab Switching
        function switchTab(tab) {
            const viewWrite = document.getElementById('view-write');
            const viewList = document.getElementById('view-list');
            const viewCal = document.getElementById('view-calendar');

            const btnWrite = document.getElementById('tab-write-btn');
            const btnList = document.getElementById('tab-list-btn');
            const btnCal = document.getElementById('tab-cal-btn');

            viewWrite.classList.add('hidden');
            viewList.classList.add('hidden');
            viewCal.classList.add('hidden');

            btnWrite.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            btnList.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";
            btnCal.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all";

            if (tab === 'write') {
                viewWrite.classList.remove('hidden');
                btnWrite.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm";
            } else if (tab === 'list') {
                viewList.classList.remove('hidden');
                btnList.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm";
                renderList();
            } else if (tab === 'calendar') {
                viewCal.classList.remove('hidden');
                btnCal.className = "px-2.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow-sm";
                renderCalendar();
            }
        }

        // Render List View
        function renderList() {
            const container = document.getElementById('diary-container');
            if (diaries.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 theme-bg-card bg-white rounded-2xl border border-slate-200/80">
                        <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
                        <p class="text-xs">작성된 일기가 없습니다.<br>첫 일기를 작성해 보세요!</p>
                    </div>`;
                return;
            }

            const fontClass = userSettings.font === 'handwriting' ? 'font-handwriting' : '';

            if (userSettings.layout === 'list') {
                // Compact List View
                container.innerHTML = diaries.map(item => `
                    <div class="theme-bg-card bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex justify-between items-center ${fontClass}">
                        <div class="flex items-center gap-2 overflow-hidden">
                            <span class="text-base">${item.mood.split(' ')[0]}</span>
                            <div class="truncate">
                                <div class="text-xs font-bold text-slate-400">${item.date}</div>
                                <div class="text-sm font-semibold truncate">${escapeHtml(item.highlight)}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0 ml-2">
                            <button onclick="copySingleDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600"><i class="fa-regular fa-copy"></i></button>
                            <button onclick="editDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600"><i class="fa-regular fa-pen-to-square"></i></button>
                            <button onclick="deleteDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </div>
                `).join('');
            } else {
                // Detailed Card View
                container.innerHTML = diaries.map(item => `
                    <div class="theme-bg-card bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-3 ${fontClass}">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="inline-block px-2 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-600 mb-1">${item.date}</span>
                                <h3 class="font-bold text-base text-slate-900">${item.mood}</h3>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="copySingleDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 text-xs" title="복사"><i class="fa-regular fa-copy"></i></button>
                                <button onclick="editDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 text-xs" title="수정"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button onclick="deleteDiary('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 text-xs" title="삭제"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                        <div class="bg-indigo-50/50 p-2.5 rounded-xl border border-indigo-100/50 text-xs font-semibold text-indigo-950">
                            ⭐ ${escapeHtml(item.highlight)}
                        </div>
                        <p class="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">${escapeHtml(item.content)}</p>
                    </div>
                `).join('');
            }
        }

        // Render Calendar View
        function renderCalendar() {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();

            document.getElementById('cal-month-year').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('cal-days-grid');
            grid.innerHTML = '';

            // Empty slots for previous month
            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="p-2 text-slate-300"></div>`;
            }

            // Days of current month
            for (let day = 1; day <= lastDate; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const entry = diaries.find(d => d.date === dateStr);

                const hasEntry = Boolean(entry);
                const emoji = hasEntry ? entry.mood.split(' ')[0] : '';

                grid.innerHTML += `
                    <div onclick="selectCalendarDate('${dateStr}')" class="p-1.5 min-h-[44px] rounded-xl border border-slate-100 flex flex-col items-center justify-between cursor-pointer hover:bg-indigo-50/50 ${hasEntry ? 'bg-indigo-50/30 border-indigo-200' : ''}">
                        <span class="font-semibold text-slate-600">${day}</span>
                        <span class="text-xs">${emoji}</span>
                    </div>
                `;
            }
        }

        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            renderCalendar();
        }

        function selectCalendarDate(dateStr) {
            const entry = diaries.find(d => d.date === dateStr);
            const container = document.getElementById('cal-selected-entry');
            container.classList.remove('hidden');

            if (!entry) {
                container.innerHTML = `
                    <div class="theme-bg-card bg-white p-4 rounded-xl border border-slate-200 text-center text-xs text-slate-400">
                        ${dateStr} 에 작성된 일기가 없습니다.
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="theme-bg-card bg-white p-4 rounded-2xl border border-slate-200 space-y-2">
                    <div class="text-xs text-slate-400 font-bold">${entry.date} - ${entry.mood}</div>
                    <div class="text-sm font-bold text-indigo-900">⭐ ${escapeHtml(entry.highlight)}</div>
                    <div class="text-xs text-slate-600 whitespace-pre-wrap">${escapeHtml(entry.content)}</div>
                </div>
            `;
        }

        // Actions: Copy, Edit, Delete
        function copySingleDiary(id) {
            const item = diaries.find(d => d.id === id);
            if (!item) return;

            const formattedText = `📅 날짜: ${item.date}\n🎭 기분: ${item.mood}\n⭐ 하이라이트: ${item.highlight}\n\n📝 내용:\n${item.content}`;
            
            const textarea = document.createElement('textarea');
            textarea.value = formattedText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('클립보드에 복사되었습니다!');
        }

        function exportAllDiaries() {
            if (diaries.length === 0) {
                showToast('내보낼 일기가 없습니다.', 'error');
                return;
            }

            let exportText = `# 📖 나의 하루 다이어리 전체 기록\n\n`;
            diaries.forEach((d, idx) => {
                exportText += `## ${idx + 1}. ${d.date} (${d.mood})\n`;
                exportText += `- **하이라이트:** ${d.highlight}\n\n`;
                exportText += `${d.content}\n\n---\n\n`;
            });

            const blob = new Blob([exportText], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `my-diaries-${new Date().toISOString().split('T')[0]}.md`;
            link.click();
            URL.revokeObjectURL(link.href);

            showToast('전체 일기 파일이 다운로드되었습니다.');
        }

        function editDiary(id) {
            const item = diaries.find(d => d.id === id);
            if (!item) return;

            document.getElementById('entry-id').value = item.id;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('entry-mood').value = item.mood;
            document.getElementById('entry-highlight').value = item.highlight;
            document.getElementById('entry-content').value = item.content;
            document.getElementById('save-btn-text').innerText = '일기 수정 완료';

            switchTab('write');
        }

        function deleteDiary(id) {
            diaries = diaries.filter(d => d.id !== id);
            saveToStorage();
            updateDiaryCount();
            renderList();
            showToast('일기가 삭제되었습니다.');
        }

        // Toast Notification
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = msg;
            toastIcon.className = type === 'error' ? 'fa-solid fa-triangle-exclamation text-rose-400' : 'fa-solid fa-circle-check text-emerald-400';

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Settings Modal Handlers
        function openSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function setTheme(theme) {
            userSettings.theme = theme;
            saveSettings();
            applySettings();
        }

        function setLayout(layout) {
            userSettings.layout = layout;
            saveSettings();
            applySettings();
            renderList();
        }

        function setFont(font) {
            userSettings.font = font;
            saveSettings();
            applySettings();
            renderList();
        }

        function saveSettings() {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(userSettings));
        }

        function applySettings() {
            document.body.className = `bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between theme-${userSettings.theme}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
