<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나의 하루 다이어리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .font-handwriting {
            font-family: 'Nanum Pen Script', cursive !important;
            font-size: 1.35rem !important;
        }
        .font-myeongjo {
            font-family: 'Nanum Myeongjo', serif !important;
        }
        .font-gowun {
            font-family: 'Gowun Dodum', sans-serif !important;
        }
        input, textarea, select {
            font-size: 16px !important;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Theme Configurations */
        body.theme-default {
            background-color: #f8fafc;
            color: #1e293b;
        }
        body.theme-default header, body.theme-default .theme-bg-card, body.theme-default .modal-card {
            background-color: #ffffff;
            color: #1e293b;
            border-color: #e2e8f0;
        }

        /* 🌫️ Soft Gray (연한 그레이) */
        body.theme-dark {
            background-color: #e2e8f0;
            color: #334155;
        }
        body.theme-dark header, body.theme-dark .theme-bg-card, body.theme-dark .modal-card {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        body.theme-dark input, body.theme-dark textarea, body.theme-dark select {
            background-color: #ffffff;
            color: #1e293b;
            border-color: #cbd5e1;
        }

        body.theme-beige {
            background-color: #fcf8f2;
            color: #4a3e3d;
        }
        body.theme-beige header, body.theme-beige .theme-bg-card, body.theme-beige .modal-card {
            background-color: #fffdfa;
            color: #4a3e3d;
            border-color: #f0e6d8;
        }
        body.theme-beige input, body.theme-beige textarea, body.theme-beige select {
            background-color: #f9f3ea;
            color: #4a3e3d;
            border-color: #e6dace;
        }

        /* 🌸 Soft Pink (연한 핑크) */
        body.theme-pink {
            background-color: #fff0f3;
            color: #5c3a42;
        }
        body.theme-pink header, body.theme-pink .theme-bg-card, body.theme-pink .modal-card {
            background-color: #ffffff;
            color: #5c3a42;
            border-color: #ffe3e8;
        }
        body.theme-pink input, body.theme-pink textarea, body.theme-pink select {
            background-color: #fff8f9;
            color: #5c3a42;
            border-color: #ffd1dc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-10 bg-white/95 backdrop-blur-md border-b border-slate-200 px-3.5 py-3 flex justify-between items-center max-w-lg mx-auto w-full">
        <h1 class="text-sm sm:text-base font-extrabold flex items-center gap-1.5 shrink-0 text-slate-800">
            <i class="fa-solid fa-book-bookmark text-indigo-600 text-sm"></i>
            <span id="app-title" class="tracking-tight">하루 기록</span>
        </h1>
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
            <button onclick="switchTab('write')" id="tab-write-btn" class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-indigo-600 text-white transition-all shadow-sm shrink-0 flex items-center gap-1.5">
                <i class="fa-solid fa-pen-to-square text-xs"></i> 작성
            </button>
            <button onclick="switchTab('list')" id="tab-list-btn" class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all shrink-0 flex items-center gap-1.5">
                <i class="fa-solid fa-list-ul text-xs"></i> 목록 (<span id="diary-count">0</span>)
            </button>
            <button onclick="switchTab('calendar')" id="tab-cal-btn" class="px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all shrink-0 flex items-center gap-1.5">
                <i class="fa-regular fa-calendar-days text-xs"></i> 달력
            </button>
            <button onclick="openSettings()" class="p-2 text-slate-600 hover:text-indigo-600 transition-colors shrink-0" title="설정">
                <i class="fa-solid fa-gear text-base"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-lg mx-auto w-full px-4 py-4 flex-1">

        <!-- TAB 1: Write / Edit Form -->
        <section id="view-write" class="space-y-4">
            <form id="diary-form" onsubmit="handleFormSubmit(event)" class="theme-bg-card bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                <input type="hidden" id="entry-id">

                <!-- Date & Mood Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">📅 날짜</label>
                        <input type="date" id="entry-date" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">🎭 오늘의 기분</label>
                        <select id="entry-mood" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="😊 기분 좋음">😊 기분 좋음</option>
                            <option value="🔥 열정/의욕">🔥 열정/의욕</option>
                            <option value="🌿 평온/느긋">🌿 평온/느긋</option>
                            <option value="💡 영감/아이디어">💡 영감/아이디어</option>
                            <option value="☕ 휴식/힐링">☕ 휴식/힐링</option>
                            <option value="😴 피곤/지침">😴 피곤/지침</option>
                            <option value="😢 우울/슬픔">😢 우울/슬픔</option>
                            <option value="⚡ 스트레스/화남">⚡ 스트레스/화남</option>
                        </select>
                    </div>
                </div>

                <!-- Highlight Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">⭐ 오늘의 하이라이트</label>
                    <input type="text" id="entry-highlight" required placeholder="오늘 하루를 대표하는 한 줄" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <!-- Main Content Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">📝 기록하기</label>
                    <textarea id="entry-content" required rows="6" placeholder="오늘 어떤 일이 있었나요? 자유롭게 텍스트로 기록해보세요..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                </div>

                <!-- Action Buttons -->
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-check"></i> <span id="save-btn-text">일기 저장하기</span>
                    </button>
                    <button type="button" onclick="resetForm()" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-sm transition-all">
                        초기화
                    </button>
                </div>
            </form>
        </section>

        <!-- TAB 2: Diary List -->
        <section id="view-list" class="hidden space-y-4">
            <div class="flex justify-between items-center px-1">
                <span class="text-xs text-slate-500 font-medium">총 <b id="list-count">0</b>개의 일기</span>
                <button onclick="exportAllDiaries()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center gap-1 bg-indigo-50 px-2.5 py-1.5 rounded-lg border border-indigo-100">
                    <i class="fa-solid fa-file-arrow-down"></i> 전체 내보내기 (.txt)
                </button>
            </div>
            <div id="diary-container" class="space-y-3">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- TAB 3: Calendar View -->
        <section id="view-calendar" class="hidden space-y-4">
            <div class="theme-bg-card bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-chevron-left"></i></button>
                    <h2 id="cal-month-year" class="font-bold text-base">2026년 10월</h2>
                    <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 mb-2">
                    <div class="text-rose-500">일</div>
                    <div>월</div>
                    <div>화</div>
                    <div>수</div>
                    <div>목</div>
                    <div>금</div>
                    <div class="text-indigo-500">토</div>
                </div>
                <div id="cal-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs">
                    <!-- Calendar days rendered here -->
                </div>
            </div>
            <div id="cal-selected-entry" class="hidden space-y-3">
                <!-- Entry details for clicked date -->
            </div>
        </section>

    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center px-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="modal-card bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl space-y-5 border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3 border-slate-100">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-gear text-indigo-600"></i> 앱 설정
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Theme Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">🎨 테마 컬러</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectThemeOpt('default')" id="theme-btn-default" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-indigo-500 bg-indigo-50 text-indigo-700">기본 (블루)</button>
                    <button type="button" onclick="selectThemeOpt('dark')" id="theme-btn-dark" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-slate-400 bg-slate-200 text-slate-800">그레이</button>
                    <button type="button" onclick="selectThemeOpt('beige')" id="theme-btn-beige" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-amber-200 bg-amber-50 text-amber-900">베이지</button>
                    <button type="button" onclick="selectThemeOpt('pink')" id="theme-btn-pink" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-rose-200 bg-pink-50 text-rose-900">연한 핑크</button>
                </div>
            </div>

            <!-- Layout Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">📐 목록 레이아웃</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="selectLayoutOpt('card')" id="layout-btn-card" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-indigo-500 bg-indigo-50 text-indigo-700">🃏 카드형</button>
                    <button type="button" onclick="selectLayoutOpt('list')" id="layout-btn-list" class="p-2.5 rounded-xl border text-xs font-semibold text-center border-slate-200 bg-slate-50 text-slate-600">📋 리스트형</button>
                </div>
            </div>

            <!-- Font Picker -->
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500">🔤 서체 (폰트)</label>
                <select id="setting-font-select" onchange="previewFontOpt(this.value)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-medium focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="sans">기본 고딕 (Noto Sans)</option>
                    <option value="handwriting">나눔손글씨 펜</option>
                    <option value="myeongjo">나눔명조 (아날로그 책)</option>
                    <option value="gowun">고운돋움 (부드러운 고딕)</option>
                </select>
            </div>

            <!-- Modal Actions -->
            <div class="pt-3 flex gap-2 border-t border-slate-100">
                <button type="button" onclick="saveSettings()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl shadow-md text-xs transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-check"></i> 적용하기
                </button>
                <button type="button" onclick="closeSettings()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl text-xs transition-all">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col gap-2"></div>

    <!-- JavaScript Logic -->
    <script>
        // Data & State Management
        let diaries = JSON.parse(localStorage.getItem('my_diaries_data') || '[]');
        let currentTab = 'write';
        let calCurrentDate = new Date();
        
        let appSettings = JSON.parse(localStorage.getItem('my_diaries_settings') || JSON.stringify({
            theme: 'default',
            layout: 'card',
            font: 'sans'
        }));

        let tempSettings = { ...appSettings };

        // DOM Initialization
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('entry-date');
            if (dateInput) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }
            applySettings(appSettings);
            renderDiaryList();
            renderCalendar();
            updateCount();
        });

        // Tab Switcher
        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById('view-write').classList.toggle('hidden', tabName !== 'write');
            document.getElementById('view-list').classList.toggle('hidden', tabName !== 'list');
            document.getElementById('view-calendar').classList.toggle('hidden', tabName !== 'calendar');

            document.getElementById('tab-write-btn').className = tabName === 'write' 
                ? "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-indigo-600 text-white transition-all shadow-sm shrink-0 flex items-center gap-1.5"
                : "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all shrink-0 flex items-center gap-1.5";

            document.getElementById('tab-list-btn').className = tabName === 'list' 
                ? "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-indigo-600 text-white transition-all shadow-sm shrink-0 flex items-center gap-1.5"
                : "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all shrink-0 flex items-center gap-1.5";

            document.getElementById('tab-cal-btn').className = tabName === 'calendar' 
                ? "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-indigo-600 text-white transition-all shadow-sm shrink-0 flex items-center gap-1.5"
                : "px-3 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all shrink-0 flex items-center gap-1.5";

            if (tabName === 'calendar') {
                renderCalendar();
            }
        }

        // Settings Modal Handlers
        function openSettings() {
            tempSettings = { ...appSettings };
            updateSettingsUI(tempSettings);
            const modal = document.getElementById('settings-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            applySettings(appSettings); // Revert to saved settings
        }

        function selectThemeOpt(themeName) {
            tempSettings.theme = themeName;
            updateSettingsUI(tempSettings);
            applyThemeClass(themeName);
        }

        function selectLayoutOpt(layoutType) {
            tempSettings.layout = layoutType;
            updateSettingsUI(tempSettings);
        }

        function previewFontOpt(fontClass) {
            tempSettings.font = fontClass;
            applyFontClass(fontClass);
        }

        function updateSettingsUI(settings) {
            const themes = ['default', 'dark', 'beige', 'pink'];
            themes.forEach(t => {
                const btn = document.getElementById(`theme-btn-${t}`);
                if (btn) {
                    if (t === settings.theme) {
                        btn.classList.add('ring-2', 'ring-indigo-600', 'ring-offset-1');
                    } else {
                        btn.classList.remove('ring-2', 'ring-indigo-600', 'ring-offset-1');
                    }
                }
            });

            const cardBtn = document.getElementById('layout-btn-card');
            const listBtn = document.getElementById('layout-btn-list');
            if (cardBtn && listBtn) {
                if (settings.layout === 'card') {
                    cardBtn.className = "p-2.5 rounded-xl border text-xs font-semibold text-center border-indigo-500 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-500 ring-offset-1";
                    listBtn.className = "p-2.5 rounded-xl border text-xs font-semibold text-center border-slate-200 bg-slate-50 text-slate-600";
                } else {
                    listBtn.className = "p-2.5 rounded-xl border text-xs font-semibold text-center border-indigo-500 bg-indigo-50 text-indigo-700 ring-2 ring-indigo-500 ring-offset-1";
                    cardBtn.className = "p-2.5 rounded-xl border text-xs font-semibold text-center border-slate-200 bg-slate-50 text-slate-600";
                }
            }

            const fontSelect = document.getElementById('setting-font-select');
            if (fontSelect) fontSelect.value = settings.font;
        }

        function saveSettings() {
            appSettings = { ...tempSettings };
            localStorage.setItem('my_diaries_settings', JSON.stringify(appSettings));
            applySettings(appSettings);
            renderDiaryList();
            closeSettings();
            showToast("⚙️ 설정이 적용되었습니다.");
        }

        function applySettings(settings) {
            applyThemeClass(settings.theme);
            applyFontClass(settings.font);
        }

        function applyThemeClass(theme) {
            document.body.className = document.body.className.replace(/theme-\S+/g, '');
            document.body.classList.add(`theme-${theme}`);
        }

        function applyFontClass(font) {
            document.body.classList.remove('font-handwriting', 'font-myeongjo', 'font-gowun');
            if (font === 'handwriting') document.body.classList.add('font-handwriting');
            if (font === 'myeongjo') document.body.classList.add('font-myeongjo');
            if (font === 'gowun') document.body.classList.add('font-gowun');
        }

        // Form Submission
        function handleFormSubmit(event) {
            event.preventDefault();
            const id = document.getElementById('entry-id').value;
            const date = document.getElementById('entry-date').value;
            const mood = document.getElementById('entry-mood').value;
            const highlight = document.getElementById('entry-highlight').value.trim();
            const content = document.getElementById('entry-content').value.trim();

            if (id) {
                const idx = diaries.findIndex(d => d.id === id);
                if (idx !== -1) {
                    diaries[idx] = { ...diaries[idx], date, mood, highlight, content, updatedAt: new Date().toISOString() };
                    showToast('✏️ 일기가 수정되었습니다.');
                }
            } else {
                const newEntry = {
                    id: Date.now().toString(),
                    date,
                    mood,
                    highlight,
                    content,
                    createdAt: new Date().toISOString()
                };
                diaries.unshift(newEntry);
                showToast('✅ 새 일기가 저장되었습니다.');
            }

            localStorage.setItem('my_diaries_data', JSON.stringify(diaries));
            resetForm();
            renderDiaryList();
            updateCount();
            switchTab('list');
        }

        function resetForm() {
            document.getElementById('entry-id').value = '';
            document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('entry-mood').selectedIndex = 0;
            document.getElementById('entry-highlight').value = '';
            document.getElementById('entry-content').value = '';
            document.getElementById('save-btn-text').innerText = '일기 저장하기';
        }

        function editEntry(id) {
            const item = diaries.find(d => d.id === id);
            if (!item) return;
            document.getElementById('entry-id').value = item.id;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('entry-mood').value = item.mood;
            document.getElementById('entry-highlight').value = item.highlight;
            document.getElementById('entry-content').value = item.content;
            document.getElementById('save-btn-text').innerText = '수정 완료하기';
            switchTab('write');
        }

        function deleteEntry(id) {
            if (confirm('정말로 이 일기를 삭제하시겠습니까?')) {
                diaries = diaries.filter(d => d.id !== id);
                localStorage.setItem('my_diaries_data', JSON.stringify(diaries));
                renderDiaryList();
                renderCalendar();
                updateCount();
                showToast('🗑️ 일기가 삭제되었습니다.');
            }
        }

        // Render Functions
        function renderDiaryList() {
            const container = document.getElementById('diary-container');
            if (diaries.length === 0) {
                container.innerHTML = `
                    <div class="theme-bg-card bg-white p-8 rounded-2xl border border-slate-200/80 text-center space-y-3">
                        <i class="fa-regular fa-folder-open text-3xl text-slate-300"></i>
                        <p class="text-sm font-medium text-slate-500">아직 저장된 일기가 없습니다.<br>오늘의 첫 일기를 남겨보세요!</p>
                        <button onclick="switchTab('write')" class="inline-block text-xs bg-indigo-600 text-white px-3.5 py-2 rounded-xl font-bold shadow-sm">일기 쓰러 가기</button>
                    </div>`;
                return;
            }

            const isCompact = appSettings.layout === 'list';

            if (isCompact) {
                container.innerHTML = diaries.map(item => `
                    <div class="theme-bg-card bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-sm flex justify-between items-center gap-3">
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-xs font-bold text-slate-400">${item.date}</span>
                                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100">${item.mood.split(' ')[0]}</span>
                            </div>
                            <h4 class="text-xs sm:text-sm font-bold text-slate-800 truncate">${escapeHtml(item.highlight)}</h4>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="copyToClipboard('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600"><i class="fa-regular fa-copy text-sm"></i></button>
                            <button onclick="editEntry('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600"><i class="fa-regular fa-pen-to-square text-sm"></i></button>
                            <button onclick="deleteEntry('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600"><i class="fa-regular fa-trash-can text-sm"></i></button>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = diaries.map(item => `
                    <article class="theme-bg-card bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
                        <div class="flex justify-between items-start border-b border-slate-100 pb-2.5">
                            <div>
                                <span class="text-xs font-bold text-slate-400 block">${item.date}</span>
                                <span class="inline-block mt-1 text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${escapeHtml(item.mood)}</span>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="copyToClipboard('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-50 transition-colors" title="복사">
                                    <i class="fa-regular fa-copy text-sm"></i>
                                </button>
                                <button onclick="editEntry('${item.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded-lg hover:bg-slate-50 transition-colors" title="수정">
                                    <i class="fa-regular fa-pen-to-square text-sm"></i>
                                </button>
                                <button onclick="deleteEntry('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-50 transition-colors" title="삭제">
                                    <i class="fa-regular fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm sm:text-base text-slate-800 mb-1.5">⭐ ${escapeHtml(item.highlight)}</h3>
                            <p class="text-xs sm:text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">${escapeHtml(item.content)}</p>
                        </div>
                    </article>
                `).join('');
            }
        }

        // Calendar Render
        function renderCalendar() {
            const year = calCurrentDate.getFullYear();
            const month = calCurrentDate.getMonth();

            document.getElementById('cal-month-year').innerText = `${year}년 ${month + 1}월`;

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('cal-days-grid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="h-10"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const entry = diaries.find(d => d.date === dateStr);
                const emoji = entry ? entry.mood.split(' ')[0] : '';

                grid.innerHTML += `
                    <button onclick="selectCalDate('${dateStr}')" class="h-10 border border-slate-100 rounded-xl flex flex-col items-center justify-center relative hover:bg-indigo-50 transition-colors ${entry ? 'bg-indigo-50/50 font-bold' : ''}">
                        <span class="text-[11px] ${entry ? 'text-indigo-600 font-extrabold' : 'text-slate-600'}">${day}</span>
                        ${emoji ? `<span class="text-xs leading-none">${emoji}</span>` : ''}
                    </button>
                `;
            }
        }

        function changeMonth(delta) {
            calCurrentDate.setMonth(calCurrentDate.getMonth() + delta);
            renderCalendar();
            document.getElementById('cal-selected-entry').classList.add('hidden');
        }

        function selectCalDate(dateStr) {
            const entry = diaries.find(d => d.date === dateStr);
            const container = document.getElementById('cal-selected-entry');

            if (!entry) {
                container.innerHTML = `
                    <div class="theme-bg-card bg-white p-4 rounded-xl border border-slate-200 text-center space-y-2">
                        <p class="text-xs font-semibold text-slate-500">${dateStr}에는 작성된 일기가 없습니다.</p>
                        <button onclick="createOnDate('${dateStr}')" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">이 날짜에 일기쓰기</button>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="theme-bg-card bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                        <div class="flex justify-between items-center border-b pb-2 border-slate-100">
                            <span class="text-xs font-bold text-slate-400">${entry.date} (${entry.mood})</span>
                            <div class="flex gap-2">
                                <button onclick="editEntry('${entry.id}')" class="text-xs font-bold text-indigo-600">수정</button>
                                <button onclick="deleteEntry('${entry.id}')" class="text-xs font-bold text-rose-500">삭제</button>
                            </div>
                        </div>
                        <h4 class="font-bold text-xs sm:text-sm text-slate-800">⭐ ${escapeHtml(entry.highlight)}</h4>
                        <p class="text-xs text-slate-600 whitespace-pre-wrap">${escapeHtml(entry.content)}</p>
                    </div>`;
            }
            container.classList.remove('hidden');
        }

        function createOnDate(dateStr) {
            resetForm();
            document.getElementById('entry-date').value = dateStr;
            switchTab('write');
        }

        // Export & Copy Helpers
        function copyToClipboard(id) {
            const item = diaries.find(d => d.id === id);
            if (!item) return;

            const text = `📅 날짜: ${item.date}\n🎭 기분: ${item.mood}\n⭐ 하이라이트: ${item.highlight}\n📝 기록하기:\n${item.content}`;

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('📋 일기 내용이 클립보드에 복사되었습니다.');
            } catch (err) {
                showToast('❌ 복사에 실패했습니다.');
            }
            document.body.removeChild(textarea);
        }

        function exportAllDiaries() {
            if (diaries.length === 0) {
                showToast('⚠️ 내보낼 일기가 없습니다.');
                return;
            }

            let fileContent = `# 📖 나의 하루 다이어리 전체 백업\n생성일시: ${new Date().toLocaleString()}\n\n---\n\n`;
            diaries.forEach((item, index) => {
                fileContent += `## ${index + 1}. ${item.date} (${item.mood})\n`;
                fileContent += `**하이라이트:** ${item.highlight}\n\n`;
                fileContent += `**기록하기:**\n${item.content}\n\n`;
                fileContent += `---\n\n`;
            });

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `diary_backup_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('💾 텍스트 파일(.txt)로 내보내기가 완료되었습니다.');
        }

        function updateCount() {
            const count = diaries.length;
            document.getElementById('diary-count').innerText = count;
            document.getElementById('list-count').innerText = count;
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg border border-slate-700 opacity-90 transition-all duration-300 transform translate-y-2';
            toast.innerText = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
